<!-- Записка агенту ИИ (lib/web/page.php → agentNote): скрыта от человека, видна тому, кто читает страницу текстом. -->
{{agentnote}}
<!-- Выбранный скин ставим до первой отрисовки. -->
<script>
  const skinParams = new URLSearchParams(location.search);
  if (window.GOBLIN_CANONICAL_VISUAL) {
    let look = skinParams.get('skin');
    if (!look && !skinParams.has('classic') && skinParams.get('visual') !== '1') {
      try { look = localStorage.getItem('goblin-graph-skin'); } catch {}
    }
    if (look === 'graph') {
      const graph = new URL('graph.php', location.href);
      graph.search = location.search;
      graph.hash = location.hash;
      graph.searchParams.set('skin', 'graph');
      window.GOBLIN_VISUAL_REDIRECTING = true;
      location.replace(graph);
    } else {
      document.body.dataset.look = look || 'studio';
    }
  } else if (skinParams.get('visual') === '1') {
    document.body.dataset.look = skinParams.get('skin') || 'studio';
  } else try {
    var look = localStorage.getItem('goblin-look');
    if (look === 'mobile' || (!look && matchMedia('(pointer: coarse)').matches)) document.body.dataset.look = 'mobile';
  } catch (e) {}
</script>
{{topbar}}
<main class="workspace">
  {{left}}
  {{canvas}}
  {{panel}}
</main>
<!-- Ярлычки боковых плашек: стоят на уровне кнопок масштаба и прячут
     рейку слева и панель справа. -->
<button class="side-toggle side-left" id="side-left" title="{{t:editor.layout.hide_left}}">‹</button>
<button class="side-toggle side-right" id="side-right" title="{{t:editor.layout.hide_right}}">›</button>
{{runbar}}
{{dialogs}}
<script type="module">
  if (!window.GOBLIN_VISUAL_REDIRECTING) import('./src/main.js?v={{version}}');
</script>
</body>
